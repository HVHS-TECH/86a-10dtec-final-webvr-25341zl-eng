<!DOCTYPE html>
<html>
  <head>

<script src="https://aframe.io/releases/1.1.0/aframe.min.js"></script>
<script src="https://rawgit.com/donmccurdy/aframe-extras/v2.1.1/dist/aframe-extras.loaders.min.js"></script> 
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@2.1.1/dist/aframe-extras.min.js"></script>

  </head>
    <body>
    <a-scene>
      <a-sky color="lightblue"></a-sky>
      
      <a-entity 
      ply-model="src:desert.ply"
      position="0 0 -2"
      rotation="-90 0 0"
      ></a-entity>

      <a-entity 
      ply-model="src:cloud.ply"
      position="0 7 -2"
      rotation="-90 0 0"
      scale="5 5 5"
      animation="
      property: position;
      from: 0 7 -2;
      to: -20 7-2;
      loop: true;
      dir: alternate;
      "
      ></a-entity>
                 
      <a-entity 
      ply-model="src:cowbow.ply"
      position="-10 -1.5 5"
      rotation="-90 0 0"
      scale="3 3 3"
  
      ></a-entity>
                 

    </a-scene>
  </body>
</html>
